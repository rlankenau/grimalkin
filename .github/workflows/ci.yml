name: CI

on:
  push:
    branches: [trunk]
    tags: ['v*']
  pull_request:

# Read-only by default. Jobs that publish release assets ask for contents: write
# themselves; only the Windows signing job gets id-token: write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The only repository that may sign Windows releases.
  UPSTREAM_REPOSITORY: rlankenau/grimalkin
  # Microsoft.Windows.Console.ConPTY (Windows Terminal project, MIT). The hash
  # pins the exact .nupkg downloaded from api.nuget.org.
  CONPTY_VERSION: 1.25.260930003
  CONPTY_SHA256: 02b07b349af66d801159bdf9e440d4a1ce78bb951f37fc8609731665afdae7ee

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libfontconfig1-dev
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Windows release pipeline.
  #
  #   windows-gate     decides, once, whether this run signs (see below)
  #   windows-build    per architecture: build + stage dist. NO cloud permissions.
  #                    Unsigned runs also package here (installer + zip).
  #   windows-sign     ONE job, the only one with `id-token: write`: signs both
  #                    architectures through AWS KMS, packages, verifies
  #   windows-smoke    per architecture, on a native runner: install / uninstall
  #                    the installer that will be released
  #   windows-release  attaches the verified assets to the GitHub release
  #
  # Signing happens only when ALL of these hold: the repository variable
  # WINDOWS_SIGNING_ENABLED is "true", the event is a push of a v* tag on the
  # upstream repository, and the tagged commit is on trunk. Once enabled, a
  # release tag fails closed: any missing configuration, signing or verification
  # error means nothing is uploaded. Every other run (PRs, forks, trunk pushes,
  # signing disabled) builds exactly as before; its installer and zip are named
  # "...-unsigned" and carry an UNSIGNED.txt. Setup: README, "Windows release
  # signing"; AWS resources: infra/aws/.
  # ---------------------------------------------------------------------------
  windows-gate:
    name: windows signing gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sign: ${{ steps.gate.outputs.sign }}
      # "" for a signed build, "-unsigned" otherwise (artifact / file names).
      suffix: ${{ steps.gate.outputs.suffix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether this run signs
        id: gate
        env:
          SIGNING_ENABLED: ${{ vars.WINDOWS_SIGNING_ENABLED }}
          ROLE_ARN: ${{ vars.AWS_SIGNING_ROLE_ARN }}
          AWS_REGION_VAR: ${{ vars.AWS_REGION }}
          PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
        run: |
          set -euo pipefail
          sign=false
          if [[ "$SIGNING_ENABLED" != "true" ]]; then
            echo "::notice::Windows signing is off (repository variable WINDOWS_SIGNING_ENABLED is not 'true'): this build is UNSIGNED"
          elif [[ "$GITHUB_REPOSITORY" != "$UPSTREAM_REPOSITORY" || "$GITHUB_EVENT_NAME" != "push" || "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::notice::Signing is enabled but only release tags (v*) pushed to $UPSTREAM_REPOSITORY are signed: this build is UNSIGNED"
          else
            # A real release: from here on every problem is an error, never a
            # silent fall back to unsigned.
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/trunk; then
              echo "::error::$GITHUB_REF points at $GITHUB_SHA, which is not on trunk; refusing to sign"
              exit 1
            fi
            for name in ROLE_ARN AWS_REGION_VAR PUBLISHER; do
              if [[ -z "${!name}" ]]; then
                echo "::error::signing is enabled but a repository variable is missing (AWS_SIGNING_ROLE_ARN, AWS_REGION, WINDOWS_SIGNING_PUBLISHER); see README, Windows release signing"
                exit 1
              fi
            done
            if ! [[ "$ROLE_ARN" =~ ^arn:aws[a-z-]*:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$ ]]; then
              echo "::error::AWS_SIGNING_ROLE_ARN is not an IAM role ARN"
              exit 1
            fi
            if ! grep -q -- '-----BEGIN CERTIFICATE-----' installer/windows/codesign-chain.pem; then
              echo "::error::installer/windows/codesign-chain.pem holds no certificate yet (still the placeholder)"
              exit 1
            fi
            sign=true
          fi
          echo "sign=$sign" >> "$GITHUB_OUTPUT"
          if [[ "$sign" == "true" ]]; then echo "suffix=" >> "$GITHUB_OUTPUT"; else echo "suffix=-unsigned" >> "$GITHUB_OUTPUT"; fi
          echo "windows signing: $sign" >> "$GITHUB_STEP_SUMMARY"

  # Builds the Windows binaries for each architecture and stages dist/ with the
  # architecture-matching ConPTY redistributable. x64 builds on windows-latest.
  # ARM64 builds natively on windows-11-arm (a free hosted runner for public
  # repositories), so the ARM64 test suite and installer smoke test run on real
  # ARM64 Windows instead of cross-compiling.
  #
  # This job runs untrusted build code (build.rs, proc macros) and therefore has
  # no cloud permissions at all: read-only contents, no id-token.
  windows-build:
    name: windows build (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: [test, windows-gate]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (pinned 2026-10-30)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # No build cache when the output will be signed: a restored cache must not
      # influence what gets a signature.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: needs.windows-gate.outputs.sign != 'true'
        with:
          key: ${{ matrix.target }}
      # Always pass --target so the output lands in target/<triple>/release,
      # separate per architecture.
      - name: Build
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p grimalkin -p grimalkin-launcher
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed: $LASTEXITCODE" }
      - name: Stage dist
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/grimalkin.exe dist/grimalkin.exe
          cp target/${{ matrix.target }}/release/grimalkin-launcher.exe dist/grimalkin.com
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version *= *"\(.*\)".*/\1/p;}' Cargo.toml | head -n1)"
          fi
          if [[ -z "$version" ]]; then echo "could not determine version" >&2; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"
      - name: Fetch ConPTY redistributable
        run: |
          ./scripts/windows/fetch-conpty.ps1 -Version $env:CONPTY_VERSION -Sha256 $env:CONPTY_SHA256 -Arch ${{ matrix.arch }} -Dest dist
          Copy-Item installer/windows/LICENSE-ConPTY.txt dist/
          Copy-Item README.md, LICENSE, LICENSE-MIT, LICENSE-APACHE dist/
          Get-ChildItem dist | Format-Table Name, Length
      - name: Check machine types (grimalkin.exe, grimalkin.com, conpty.dll, OpenConsole.exe)
        run: scripts/windows/check-pe-machine.ps1 -Dir dist -Arch ${{ matrix.arch }}
      # The ConPTY pair must be byte-identical to the pinned NuGet package and
      # keep Microsoft's own signature. (grimalkin never re-signs these.)
      - name: Check the ConPTY pair against the package and its Microsoft signature
        run: scripts/windows/check-conpty.ps1 -Dir dist -Arch ${{ matrix.arch }} -Version $env:CONPTY_VERSION -Sha256 $env:CONPTY_SHA256
      - name: Test the signature verifier (mocked trust APIs)
        run: scripts/windows/test-verify-signature.ps1
      - name: Upload dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.arch }}
          path: dist
          if-no-files-found: error
          retention-days: 7

      # ---- unsigned packaging (this run does not sign) ---------------------------
      # The signing job packages signed runs; everything below only runs when
      # signing is off, and produces "-unsigned" names so an unsigned file can
      # never be mistaken for a release.
      - name: Package unsigned zip
        if: needs.windows-gate.outputs.sign != 'true'
        run: |
          @(
            'UNSIGNED build of grimalkin for Windows.',
            'These files carry no Authenticode signature and no verified publisher.',
            'Windows SmartScreen / Smart App Control may warn about them.',
            'Signed releases are announced in the README; see "Windows release signing".'
          ) | Set-Content dist/UNSIGNED.txt
          Compress-Archive -Path dist/* -DestinationPath grimalkin-portable-${{ matrix.arch }}-unsigned.zip
      - name: Build unsigned installer and CI test twin
        if: needs.windows-gate.outputs.sign != 'true'
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/windows/build-installer.ps1 -Arch ${{ matrix.arch }} -Version $env:APP_VERSION
          # CI-only twin that behaves as an unelevated setup even on this
          # administrator runner, to exercise the per-user replace flow. Not
          # released; the shipped installer is the one above.
          ./scripts/windows/build-installer.ps1 -Arch ${{ matrix.arch }} -Version $env:APP_VERSION -CITest
      - name: Upload unsigned installer
        if: needs.windows-gate.outputs.sign != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grimalkin-setup-${{ matrix.arch }}-unsigned
          path: installer-out/grimalkin-setup-${{ matrix.arch }}-unsigned.exe
          if-no-files-found: error
      - name: Upload unsigned portable zip
        if: needs.windows-gate.outputs.sign != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grimalkin-portable-${{ matrix.arch }}-unsigned
          path: grimalkin-portable-${{ matrix.arch }}-unsigned.zip
          if-no-files-found: error
      - name: Upload CI test installer
        if: needs.windows-gate.outputs.sign != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-citest-${{ matrix.arch }}
          path: installer-test/grimalkin-setup-citest-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 3

  # Signs both architectures, builds the signed installers and zips, verifies
  # everything, and only then uploads. The ONLY job with `id-token: write`.
  #
  # It never runs cargo or any code from the build: it downloads the staged
  # binaries, runs jsign (hash-pinned) and ISCC over them. Key custody: the
  # private key is an AWS KMS key that cannot be exported; this job's role may
  # only Sign / GetPublicKey / DescribeKey with it (infra/aws/).
  windows-sign:
    name: windows sign
    runs-on: windows-latest
    needs: [windows-gate, windows-build]
    if: needs.windows-gate.outputs.sign == 'true'
    permissions:
      id-token: write
      contents: read
    env:
      # jsign (https://ebourg.github.io/jsign/), downloaded from its GitHub
      # release; the hash pins the exact jar. To update: change both, after
      # checking the release.
      JSIGN_VERSION: '7.6'
      JSIGN_SHA256: 6cf58aa080e7ff82656f320cff8d4a3bff30408df8766806dcba3740dd839fa5
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_KMS_KEY_ALIAS: ${{ vars.AWS_KMS_KEY_ALIAS || 'alias/grimalkin-codesign' }}
      WINDOWS_SIGNING_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
      WINDOWS_SIGNING_TSA_URL: ${{ vars.WINDOWS_SIGNING_TSA_URL || 'http://timestamp.digicert.com' }}
      SIGNING_CHAIN: installer/windows/codesign-chain.pem
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Assert this is an authorised release run
        run: |
          if ($env:GITHUB_REPOSITORY -cne $env:UPSTREAM_REPOSITORY -or $env:GITHUB_EVENT_NAME -ne 'push' -or $env:GITHUB_REF -notlike 'refs/tags/v*') {
            throw 'signing is restricted to v* tag pushes on the upstream repository'
          }
          $version = $env:GITHUB_REF_NAME.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+([-+][0-9A-Za-z.+-]+)?$') { throw "unexpected tag: $env:GITHUB_REF_NAME" }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-x64
          path: stage/x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-arm64
          path: stage/arm64
      - name: Check the staged files before signing anything
        run: |
          foreach ($arch in 'x64', 'arm64') {
            if (Test-Path "stage/$arch/UNSIGNED.txt") { throw "stage/$arch contains UNSIGNED.txt in a signing run" }
            scripts/windows/check-pe-machine.ps1 -Dir "stage/$arch" -Arch $arch
            scripts/windows/check-conpty.ps1 -Dir "stage/$arch" -Arch $arch -Version $env:CONPTY_VERSION -Sha256 $env:CONPTY_SHA256
          }
          # Copies for the negative tests: an unsigned binary and a ConPTY file.
          New-Item -ItemType Directory $env:RUNNER_TEMP/negative | Out-Null
          Copy-Item stage/x64/grimalkin.exe $env:RUNNER_TEMP/negative/unsigned-sample.exe
          Copy-Item stage/x64/conpty.dll $env:RUNNER_TEMP/negative/conpty.dll
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Download and verify jsign
        run: |
          $jar = Join-Path $env:RUNNER_TEMP "jsign-$($env:JSIGN_VERSION).jar"
          Invoke-WebRequest -Uri "https://github.com/ebourg/jsign/releases/download/$($env:JSIGN_VERSION)/jsign-$($env:JSIGN_VERSION).jar" -OutFile $jar
          $actual = (Get-FileHash -Algorithm SHA256 $jar).Hash.ToLowerInvariant()
          if ($actual -ne $env:JSIGN_SHA256) {
            Remove-Item $jar -Force
            throw "SHA256 mismatch for jsign $($env:JSIGN_VERSION): expected $($env:JSIGN_SHA256), got $actual"
          }
          "JSIGN_JAR=$jar" >> $env:GITHUB_ENV
          java -version
      - name: Assume the signing role (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_SIGNING_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: grimalkin-sign-${{ github.run_id }}
          role-duration-seconds: 1800
      - name: Check that the certificate chain belongs to the KMS key
        run: |
          scripts/windows/check-signing-config.ps1 -ChainFile $env:SIGNING_CHAIN -ExpectedSubject $env:WINDOWS_SIGNING_PUBLISHER -KeyAlias $env:AWS_KMS_KEY_ALIAS -Region $env:AWS_REGION
      # grimalkin.exe and the renamed launcher grimalkin.com, both architectures.
      # Each file is verified right after it is signed. conpty.dll and
      # OpenConsole.exe are deliberately not in this list (and sign-file.ps1
      # refuses them).
      - name: Sign first-party binaries and verify each
        run: |
          foreach ($arch in 'x64', 'arm64') {
            foreach ($name in 'grimalkin.exe', 'grimalkin.com') {
              $file = "stage/$arch/$name"
              scripts/windows/sign-file.ps1 -Path $file
              scripts/windows/verify-signature.ps1 -Path $file -ExpectedSubject $env:WINDOWS_SIGNING_PUBLISHER -ChainFile $env:SIGNING_CHAIN
            }
          }
      - name: Negative tests of the verifier (on copies)
        run: |
          scripts/windows/test-verify-signature.ps1 `
            -UnsignedPath "$env:RUNNER_TEMP/negative/unsigned-sample.exe" `
            -SignedPath stage/x64/grimalkin.exe, stage/x64/grimalkin.com, stage/arm64/grimalkin.exe, stage/arm64/grimalkin.com `
            -ConptyPath "$env:RUNNER_TEMP/negative/conpty.dll" `
            -ExpectedSubject $env:WINDOWS_SIGNING_PUBLISHER -ChainFile $env:SIGNING_CHAIN
      - name: Build signed installers (Setup and uninstaller signed by Inno)
        run: |
          . scripts/windows/signing-common.ps1
          $publisher = (Read-PemCertificates $env:SIGNING_CHAIN)[0].GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          foreach ($arch in 'x64', 'arm64') {
            # ISCC builds the arm64 installer fine on this x64 runner.
            scripts/windows/build-installer.ps1 -Arch $arch -Version $env:APP_VERSION -Dist "stage/$arch" -Sign -Publisher $publisher
            scripts/windows/verify-signature.ps1 -Path "installer-out/grimalkin-setup-$arch.exe" -ExpectedSubject $env:WINDOWS_SIGNING_PUBLISHER -ChainFile $env:SIGNING_CHAIN
            # CI-only twin (unelevated behaviour): payload is the signed one, the
            # twin itself is never signed or released.
            scripts/windows/build-installer.ps1 -Arch $arch -Version $env:APP_VERSION -Dist "stage/$arch" -CITest
          }
      - name: Build portable zips and verify what is inside them
        run: |
          foreach ($arch in 'x64', 'arm64') {
            $zip = "grimalkin-portable-$arch.zip"
            Compress-Archive -Path "stage/$arch/*" -DestinationPath $zip
            $x = Join-Path $env:RUNNER_TEMP "unzip-$arch"
            Expand-Archive -LiteralPath $zip -DestinationPath $x
            foreach ($f in Get-ChildItem "stage/$arch" -File) {
              if ((Get-FileHash $f.FullName).Hash -ne (Get-FileHash (Join-Path $x $f.Name)).Hash) { throw "$arch zip: $($f.Name) differs from the staged file" }
            }
            scripts/windows/verify-signature.ps1 -Path "$x/grimalkin.exe", "$x/grimalkin.com" -ExpectedSubject $env:WINDOWS_SIGNING_PUBLISHER -ChainFile $env:SIGNING_CHAIN
            scripts/windows/check-conpty.ps1 -Dir $x -Arch $arch -Version $env:CONPTY_VERSION -Sha256 $env:CONPTY_SHA256
            scripts/windows/check-pe-machine.ps1 -Dir $x -Arch $arch
          }
      - name: Upload signed x64 installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grimalkin-setup-x64
          path: installer-out/grimalkin-setup-x64.exe
          if-no-files-found: error
      - name: Upload signed arm64 installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grimalkin-setup-arm64
          path: installer-out/grimalkin-setup-arm64.exe
          if-no-files-found: error
      - name: Upload signed x64 portable zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grimalkin-portable-x64
          path: grimalkin-portable-x64.zip
          if-no-files-found: error
      - name: Upload signed arm64 portable zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grimalkin-portable-arm64
          path: grimalkin-portable-arm64.zip
          if-no-files-found: error
      - name: Upload CI test installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-citest-all
          path: installer-test/grimalkin-setup-citest-*.exe
          if-no-files-found: error
          retention-days: 3

  # The installer is built for ${{ matrix.arch }}; it can only run on a machine
  # of that architecture. x64 runs on windows-latest (x64), arm64 on
  # windows-11-arm (native ARM64). Signed or unsigned, it is the installer that
  # will be released. The smoke test itself is scripts/windows/smoke-installer.ps1.
  windows-smoke:
    name: windows smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: [windows-gate, windows-build, windows-sign]
    # Run after a successful sign job, or when signing is off (sign job skipped).
    if: ${{ !cancelled() && needs.windows-build.result == 'success' && (needs.windows-gate.outputs.sign != 'true' || needs.windows-sign.result == 'success') }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
          - arch: arm64
            os: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: grimalkin-setup-${{ matrix.arch }}${{ needs.windows-gate.outputs.suffix }}
          path: installer-out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: grimalkin-portable-${{ matrix.arch }}${{ needs.windows-gate.outputs.suffix }}
          path: portable
      # Signed runs upload one artifact with both twins; unsigned runs one per arch.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: installer-citest-*
          merge-multiple: true
          path: installer-test
      - name: Check the portable zip
        env:
          SIGNED: ${{ needs.windows-gate.outputs.sign }}
          PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
          SUFFIX: ${{ needs.windows-gate.outputs.suffix }}
        run: |
          $x = Join-Path $env:RUNNER_TEMP 'portable'
          Expand-Archive -LiteralPath "portable/grimalkin-portable-${{ matrix.arch }}$($env:SUFFIX).zip" -DestinationPath $x
          scripts/windows/check-pe-machine.ps1 -Dir $x -Arch ${{ matrix.arch }}
          $unsignedMarker = Test-Path (Join-Path $x 'UNSIGNED.txt')
          if ($env:SIGNED -eq 'true') {
            if ($unsignedMarker) { throw 'a signed portable zip must not contain UNSIGNED.txt' }
            scripts/windows/verify-signature.ps1 -Path "$x/grimalkin.exe", "$x/grimalkin.com" -ExpectedSubject $env:PUBLISHER -ChainFile installer/windows/codesign-chain.pem -AllowMissingSignTool
          } elseif (-not $unsignedMarker) {
            throw 'an unsigned portable zip must contain UNSIGNED.txt'
          }
          & "$x/grimalkin.com" --version
          if ($LASTEXITCODE -ne 0) { throw "portable grimalkin.com --version failed: $LASTEXITCODE" }
      - name: Smoke-test installer (silent install, check, uninstall)
        env:
          SIGNED: ${{ needs.windows-gate.outputs.sign }}
          PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
          SUFFIX: ${{ needs.windows-gate.outputs.suffix }}
        run: |
          $params = @{
            Arch            = '${{ matrix.arch }}'
            SetupPath       = "installer-out/grimalkin-setup-${{ matrix.arch }}$($env:SUFFIX).exe"
            CITestSetupPath = 'installer-test/grimalkin-setup-citest-${{ matrix.arch }}.exe'
          }
          if ($env:SIGNED -eq 'true') {
            $params.Signed = $true
            $params.ExpectedSubject = $env:PUBLISHER
            $params.ChainFile = 'installer/windows/codesign-chain.pem'
          }
          scripts/windows/smoke-installer.ps1 @params

  # Attaches the verified assets to the GitHub release. Runs only for a tag, and
  # only after both architectures passed the signature checks (when signed) and
  # the installer smoke tests. The bare grimalkin.exe / grimalkin.com are NOT
  # attached (the x64 and ARM64 names would collide); they are inside the zips.
  windows-release:
    name: windows release assets
    runs-on: ubuntu-latest
    needs: [windows-gate, windows-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: grimalkin-setup-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: grimalkin-portable-*
          merge-multiple: true
          path: release
      - name: List and sanity-check the assets
        env:
          SIGNED: ${{ needs.windows-gate.outputs.sign }}
          SUFFIX: ${{ needs.windows-gate.outputs.suffix }}
        run: |
          set -euo pipefail
          ls -l release
          for arch in x64 arm64; do
            test -s "release/grimalkin-setup-${arch}${SUFFIX}.exe"
            test -s "release/grimalkin-portable-${arch}${SUFFIX}.zip"
          done
          test "$(find release -type f | wc -l)" -eq 4
          if [[ "$SIGNED" == "true" && -n "$(find release -type f -name '*unsigned*')" ]]; then
            echo "::error::a signed release must not contain unsigned assets"; exit 1
          fi
      - name: Attach to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release/*

  # Verifies the exe resources (build.rs / winresource): the icon group and the
  # version info must actually be in the shipped binaries, for each architecture.
  windows-exe-resources:
    name: windows exe icon and version info (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: windows-build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
          - arch: arm64
            os: windows-11-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-${{ matrix.arch }}
          path: dist
      - name: Check machine types
        shell: pwsh
        run: scripts/windows/check-pe-machine.ps1 -Dir dist -Arch ${{ matrix.arch }} -Files grimalkin.exe,grimalkin.com
      - name: Check icon and version resources
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class IconProbe {
            [DllImport("shell32.dll", CharSet = CharSet.Unicode)]
            public static extern uint ExtractIconEx(string file, int index, IntPtr[] large, IntPtr[] small, uint n);
          }
          '@
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          foreach ($name in 'grimalkin.exe', 'grimalkin.com') {
            $path = (Resolve-Path "dist/$name").Path
            # ExtractIconEx keys off the extension (.com is treated as a DOS program), so probe a .exe copy.
            $probe = Join-Path $env:RUNNER_TEMP "probe-$name.exe"
            Copy-Item $path $probe -Force
            $icons = [IconProbe]::ExtractIconEx($probe, -1, $null, $null, 0)
            $info = (Get-Item $path).VersionInfo
            Write-Host "$name icons=$icons product=$($info.ProductName) file=$($info.FileVersion) desc=$($info.FileDescription)"
            if ($icons -lt 1) { throw "$name has no embedded icon" }
            if ($info.ProductName -ne 'Grimalkin') { throw "${name}: unexpected ProductName" }
            if ($info.FileVersion -notlike "$version*") { throw "${name}: FileVersion $($info.FileVersion) != $version" }
          }

  macos-bundle:
    name: macos bundle (${{ matrix.arch }})
    runs-on: macos-latest
    needs: test
    permissions:
      contents: write   # attaches the dmg to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is Apple Silicon: arm64 is a native build, x86_64 is
          # cross-compiled with the extra rust target (same runner, cheap).
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Optional Developer ID signing and notarization. Secrets cannot be used
      # in `if:`, so each step reads them into env and bails out when unset
      # (forks and PRs without secrets build ad-hoc signed, exactly as before).
      # Setup: README, "Release signing setup".
      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CERT_P12_BASE64" || -z "$CERT_PASSWORD" ]]; then
            echo "MACOS_CERT_* secrets not set: building ad-hoc signed"
            exit 0
          fi
          keychain="$RUNNER_TEMP/grimalkin-signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" >/dev/null
          # Put the temporary keychain first in the user search list.
          existing="$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "$keychain" $existing
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk '/"Developer ID Application:/ { print $2; exit }')"
          if [[ -z "$identity" ]]; then
            echo "no Developer ID Application identity in the imported p12" >&2
            exit 1
          fi
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "GRIMALKIN_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Prepare notarization key
        env:
          KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$KEY_P8_BASE64" || -z "$KEY_ID" || -z "$ISSUER_ID" ]]; then
            echo "NOTARY_* secrets not set: skipping notarization"
            exit 0
          fi
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$KEY_P8_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          {
            echo "GRIMALKIN_NOTARY_KEY_PATH=$key"
            echo "GRIMALKIN_NOTARY_KEY_ID=$KEY_ID"
            echo "GRIMALKIN_NOTARY_ISSUER=$ISSUER_ID"
          } >> "$GITHUB_ENV"
      - name: Build app bundle and dmg
        run: scripts/make-app-bundle.sh --target ${{ matrix.target }}
      - name: Check the dmg
        run: |
          set -euo pipefail
          dmg=$(ls dist/grimalkin-*-macos-${{ matrix.arch }}.dmg)
          hdiutil attach -readonly -nobrowse -mountpoint /tmp/grimalkin-dmg "$dmg"
          ls -la /tmp/grimalkin-dmg
          test -x /tmp/grimalkin-dmg/grimalkin.app/Contents/MacOS/grimalkin
          test -L /tmp/grimalkin-dmg/Applications
          codesign --verify --deep --strict /tmp/grimalkin-dmg/grimalkin.app
          lipo -archs /tmp/grimalkin-dmg/grimalkin.app/Contents/MacOS/grimalkin
          if [[ -n "${GRIMALKIN_NOTARY_KEY_ID:-}" ]]; then
            xcrun stapler validate /tmp/grimalkin-dmg/grimalkin.app
            spctl --assess --type execute --verbose=2 /tmp/grimalkin-dmg/grimalkin.app
            xcrun stapler validate "$dmg"
          fi
          hdiutil detach /tmp/grimalkin-dmg
      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: grimalkin-macos-${{ matrix.arch }}
          path: dist/grimalkin-*-macos-${{ matrix.arch }}.dmg
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/grimalkin-*-macos-${{ matrix.arch }}.dmg
