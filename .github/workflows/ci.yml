name: CI

on:
  push:
    branches: [trunk]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libfontconfig1-dev
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Builds the Windows release binaries for each architecture, bundles the
  # architecture-matching ConPTY redistributable and produces the Inno Setup
  # installer and the portable zip. Also uploads the plain exe+com pair as
  # grimalkin-windows-<arch>.
  #
  # x64 builds on windows-latest. ARM64 builds natively on windows-11-arm (a
  # free hosted runner for public repositories), so the ARM64 test suite and the
  # installer smoke test run on real ARM64 Windows instead of cross-compiling.
  windows-installer:
    name: windows installer (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            # Paths inside the ConPTY .nupkg for this architecture.
            conpty_dll: runtimes/win-x64/native/conpty.dll
            conpty_openconsole: build/native/runtimes/x64/OpenConsole.exe
          - arch: arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            conpty_dll: runtimes/win-arm64/native/conpty.dll
            conpty_openconsole: build/native/runtimes/arm64/OpenConsole.exe
    env:
      # Microsoft.Windows.Console.ConPTY (Windows Terminal project, MIT). The
      # hash pins the exact .nupkg downloaded from api.nuget.org.
      CONPTY_VERSION: 1.25.260930003
      CONPTY_SHA256: 02b07b349af66d801159bdf9e440d4a1ce78bb951f37fc8609731665afdae7ee
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Always pass --target so the output lands in target/<triple>/release,
      # separate per architecture.
      - run: cargo build --release --locked --target ${{ matrix.target }} -p grimalkin -p grimalkin-launcher
      - name: Stage dist
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/grimalkin.exe dist/grimalkin.exe
          cp target/${{ matrix.target }}/release/grimalkin-launcher.exe dist/grimalkin.com
      - name: Upload plain exe and com
        uses: actions/upload-artifact@v4
        with:
          name: grimalkin-windows-${{ matrix.arch }}
          path: |
            dist/grimalkin.exe
            dist/grimalkin.com
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version *= *"\(.*\)".*/\1/p;}' Cargo.toml | head -n1)"
          fi
          if [[ -z "$version" ]]; then echo "could not determine version" >&2; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"
      - name: Fetch ConPTY redistributable
        shell: pwsh
        env:
          CONPTY_DLL_ENTRY: ${{ matrix.conpty_dll }}
          CONPTY_OPENCONSOLE_ENTRY: ${{ matrix.conpty_openconsole }}
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:CONPTY_VERSION
          $pkg = "microsoft.windows.console.conpty.$v.nupkg"
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.windows.console.conpty/$v/$pkg"
          Invoke-WebRequest -Uri $url -OutFile $pkg
          $actual = (Get-FileHash -Algorithm SHA256 $pkg).Hash.ToLowerInvariant()
          if ($actual -ne $env:CONPTY_SHA256) {
            throw "SHA256 mismatch for ${pkg}: expected $($env:CONPTY_SHA256), got $actual"
          }
          # A .nupkg is a zip. Extract the pair for THIS architecture next to
          # grimalkin.exe. A missing entry fails the job: never fall back to
          # another architecture's files.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $wanted = [ordered]@{
            $env:CONPTY_DLL_ENTRY         = 'conpty.dll'
            $env:CONPTY_OPENCONSOLE_ENTRY = 'OpenConsole.exe'
          }
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $pkg).Path)
          try {
            foreach ($name in $wanted.Keys) {
              $entry = $zip.GetEntry($name)
              if ($null -eq $entry) { throw "${{ matrix.arch }} asset $name not found in $pkg; refusing to ship another architecture under the ${{ matrix.arch }} label" }
              if ($entry.Length -eq 0) { throw "$name is empty in $pkg" }
              $dest = Join-Path (Resolve-Path dist).Path $wanted[$name]
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $dest, $true)
            }
          } finally { $zip.Dispose() }
          Copy-Item installer/windows/LICENSE-ConPTY.txt dist/
          Copy-Item README.md, LICENSE, LICENSE-MIT, LICENSE-APACHE dist/
          Get-ChildItem dist | Format-Table Name, Length
      - name: Check machine types (grimalkin.exe, grimalkin.com, conpty.dll, OpenConsole.exe)
        shell: pwsh
        run: scripts/windows/check-pe-machine.ps1 -Dir dist -Arch ${{ matrix.arch }}
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath grimalkin-portable-${{ matrix.arch }}.zip
      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Inno Setup 6 is preinstalled on the windows runner images (6.7.x on
          # windows-latest and windows-11-arm; ARM64 installers need 6.3+).
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            Write-Host 'Inno Setup 6 not preinstalled; installing with choco'
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'choco install innosetup failed' }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          $full = '${{ steps.version.outputs.version }}'
          # Inno's VersionInfoVersion must be numeric x.y.z.w: drop any -suffix/+build.
          $core = ($full -split '[-+]')[0]
          if ($core -notmatch '^\d+\.\d+\.\d+$') { throw "unexpected version format: $full" }
          $numeric = "$core.0"
          Write-Host "AppVersion=$full AppVersionNumeric=$numeric Arch=${{ matrix.arch }}"
          & $iscc "/DAppVersion=$full" "/DAppVersionNumeric=$numeric" "/DArch=${{ matrix.arch }}" installer/windows/grimalkin.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-Item installer-out/grimalkin-setup-${{ matrix.arch }}.exe
          # CI-only twin that behaves as an unelevated setup even on this
          # administrator runner, to exercise the per-user replace flow. Not
          # uploaded or released; the shipped installer is the one above.
          & $iscc "/DAppVersion=$full" "/DAppVersionNumeric=$numeric" "/DArch=${{ matrix.arch }}" /DCITestUnelevated /Oinstaller-test "/Fgrimalkin-setup-citest-${{ matrix.arch }}" installer/windows/grimalkin.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC (CI test build) failed with exit code $LASTEXITCODE" }
          Get-Item installer-test/grimalkin-setup-citest-${{ matrix.arch }}.exe
      # The installer is built for ${{ matrix.arch }}; it can only run on a
      # machine of that architecture. x64 builds run on windows-latest (x64);
      # arm64 builds run on windows-11-arm (native ARM64), so both get smoked.
      - name: Smoke-test installer (silent install, check, uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = '${{ matrix.arch }}'
          $setup = (Resolve-Path installer-out/grimalkin-setup-$arch.exe).Path
          # Per-user silent install with the optional tasks turned on.
          $p = Start-Process $setup -Wait -PassThru -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/TASKS=addtopath,contextmenu','/LOG=install.log'
          if ($p.ExitCode -ne 0) { Get-Content install.log; throw "installer exit code $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\grimalkin'
          foreach ($f in 'grimalkin.exe','grimalkin.com','conpty.dll','OpenConsole.exe','LICENSE-ConPTY.txt','README.md','unins000.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing after install: $f" }
          }
          # The installed binaries are the right architecture too.
          scripts/windows/check-pe-machine.ps1 -Dir $dir -Arch $arch
          $recorded = (Get-ItemProperty 'HKCU:\Software\grimalkin\Install').Arch
          if ($recorded -ne $arch) { throw "installed Arch value is '$recorded', expected '$arch'" }
          $userPath = [Environment]::GetEnvironmentVariable('Path','User')
          if (-not (($userPath -split ';') -contains $dir)) { throw "install dir not on user PATH: $userPath" }
          $cmd = (Get-ItemProperty 'HKCU:\Software\Classes\Directory\Background\shell\grimalkin\command').'(default)'
          Write-Host "context menu command: $cmd"
          if ($cmd -notlike '*--working-directory*') { throw 'context menu command missing' }
          & (Join-Path $dir 'grimalkin.com') --version
          if ($LASTEXITCODE -ne 0) { throw "grimalkin.com --version failed: $LASTEXITCODE" }

          # Coexistence: pretend the install on disk is the OTHER architecture.
          # Re-running this installer must then refuse (silent mode, no
          # /REPLACEARCH) and leave the install untouched.
          $other = if ($arch -eq 'x64') { 'arm64' } else { 'x64' }
          Set-ItemProperty 'HKCU:\Software\grimalkin\Install' -Name Arch -Value $other
          $p = Start-Process $setup -Wait -PassThru -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/TASKS=addtopath,contextmenu','/LOG=refuse.log'
          Write-Host "installer exit code with $other install present and no /REPLACEARCH: $($p.ExitCode)"
          if ($p.ExitCode -eq 0) { throw "installer must refuse to install over a $other install without /REPLACEARCH=1" }
          if (-not (Test-Path (Join-Path $dir 'grimalkin.exe'))) { throw 'refused install must leave the existing install untouched' }
          # Security rule (review finding): an ELEVATED setup must never run a
          # per-user (HKCU) uninstaller, even with /REPLACEARCH=1. This runner is
          # an administrator, so the shipped installer is elevated here.
          $isAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "runner is elevated: $isAdmin"
          if ($isAdmin) {
            $p = Start-Process $setup -Wait -PassThru -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/REPLACEARCH=1','/TASKS=addtopath,contextmenu','/LOG=elevated-refuse.log'
            Write-Host "elevated installer exit code with a per-user $other install and /REPLACEARCH=1: $($p.ExitCode)"
            if ($p.ExitCode -eq 0) { throw 'an elevated installer must not replace a per-user install of the other architecture' }
            if ((Get-Content elevated-refuse.log -Raw) -notmatch 'Refusing to run a per-user uninstaller') { Get-Content elevated-refuse.log; throw 'elevated refusal not logged' }
            if ((Get-Content elevated-refuse.log -Raw) -match 'Removing other-architecture install') { throw 'elevated installer ran the per-user uninstaller' }
            $recorded = (Get-ItemProperty 'HKCU:\Software\grimalkin\Install').Arch
            if ($recorded -ne $other) { throw "elevated refusal changed the Arch value to '$recorded'" }
            if (-not (Test-Path (Join-Path $dir 'grimalkin.exe'))) { throw 'elevated refusal must leave the existing install untouched' }
          }
          # Unelevated per-user flow (CI-only twin build): with /REPLACEARCH=1 it
          # uninstalls the old install first and ends with one consistent install.
          $setup = (Resolve-Path installer-test/grimalkin-setup-citest-$arch.exe).Path
          $p = Start-Process $setup -Wait -PassThru -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/REPLACEARCH=1','/TASKS=addtopath,contextmenu','/LOG=replace.log'
          if ($p.ExitCode -ne 0) { Get-Content replace.log; throw "installer with /REPLACEARCH=1 exit code $($p.ExitCode)" }
          $recorded = (Get-ItemProperty 'HKCU:\Software\grimalkin\Install').Arch
          if ($recorded -ne $arch) { throw "after replacing, Arch is '$recorded', expected '$arch'" }
          if ((Get-Content replace.log -Raw) -notmatch 'other-architecture install') { Get-Content replace.log; throw 'replace log does not show the old install being removed' }
          scripts/windows/check-pe-machine.ps1 -Dir $dir -Arch $arch
          $userPath = [Environment]::GetEnvironmentVariable('Path','User')
          if ((($userPath -split ';') | Where-Object { $_ -eq $dir }).Count -ne 1) { throw "install dir must be on user PATH exactly once: $userPath" }

          # Uninstall via the registered uninstaller (after a replace its file
          # name need not be unins000.exe). _?= runs it in place so -Wait really waits.
          Get-ChildItem $dir -Filter 'unins*' | Format-Table Name, Length
          $uninst = ((Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{5E56C746-3735-4FF7-96B9-E90F7D4C5AA7}_is1').UninstallString).Trim('"')
          Write-Host "registered uninstaller: $uninst"
          if (-not (Test-Path $uninst)) { throw "registered uninstaller missing: $uninst" }
          $u = Start-Process $uninst -Wait -PassThru -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"_?=$dir"
          if ($u.ExitCode -ne 0) { throw "uninstaller exit code $($u.ExitCode)" }
          $userPath = [Environment]::GetEnvironmentVariable('Path','User')
          if (($userPath -split ';') -contains $dir) { throw 'install dir still on user PATH after uninstall' }
          if (Test-Path 'HKCU:\Software\Classes\Directory\shell\grimalkin') { throw 'context menu key left behind' }
          if (Test-Path 'HKCU:\Software\Classes\Directory\Background\shell\grimalkin') { throw 'background context menu key left behind' }
          if (Test-Path 'HKCU:\Software\grimalkin\Install') { throw 'Arch marker key left behind' }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: grimalkin-setup-${{ matrix.arch }}
          path: installer-out/grimalkin-setup-${{ matrix.arch }}.exe
      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: grimalkin-portable-${{ matrix.arch }}
          path: grimalkin-portable-${{ matrix.arch }}.zip
      # Release assets: installer and portable zip per architecture. The bare
      # grimalkin.exe / grimalkin.com are NOT attached any more (the x64 and
      # ARM64 names would collide); they are inside the portable zips and the
      # grimalkin-windows-<arch> workflow artifacts.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer-out/grimalkin-setup-${{ matrix.arch }}.exe
            grimalkin-portable-${{ matrix.arch }}.zip

  # Verifies the exe resources (build.rs / winresource): the icon group and the
  # version info must actually be in the shipped binaries, for each architecture.
  windows-exe-resources:
    name: windows exe icon and version info (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: windows-installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
          - arch: arm64
            os: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: grimalkin-windows-${{ matrix.arch }}
          path: dist
      - name: Check machine types
        shell: pwsh
        run: scripts/windows/check-pe-machine.ps1 -Dir dist -Arch ${{ matrix.arch }} -Files grimalkin.exe,grimalkin.com
      - name: Check icon and version resources
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class IconProbe {
            [DllImport("shell32.dll", CharSet = CharSet.Unicode)]
            public static extern uint ExtractIconEx(string file, int index, IntPtr[] large, IntPtr[] small, uint n);
          }
          '@
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          foreach ($name in 'grimalkin.exe', 'grimalkin.com') {
            $path = (Resolve-Path "dist/$name").Path
            # ExtractIconEx keys off the extension (.com is treated as a DOS program), so probe a .exe copy.
            $probe = Join-Path $env:RUNNER_TEMP "probe-$name.exe"
            Copy-Item $path $probe -Force
            $icons = [IconProbe]::ExtractIconEx($probe, -1, $null, $null, 0)
            $info = (Get-Item $path).VersionInfo
            Write-Host "$name icons=$icons product=$($info.ProductName) file=$($info.FileVersion) desc=$($info.FileDescription)"
            if ($icons -lt 1) { throw "$name has no embedded icon" }
            if ($info.ProductName -ne 'Grimalkin') { throw "${name}: unexpected ProductName" }
            if ($info.FileVersion -notlike "$version*") { throw "${name}: FileVersion $($info.FileVersion) != $version" }
          }

  macos-bundle:
    name: macos bundle (${{ matrix.arch }})
    runs-on: macos-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is Apple Silicon: arm64 is a native build, x86_64 is
          # cross-compiled with the extra rust target (same runner, cheap).
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Optional Developer ID signing and notarization. Secrets cannot be used
      # in `if:`, so each step reads them into env and bails out when unset
      # (forks and PRs without secrets build ad-hoc signed, exactly as before).
      # Setup: README, "Release signing setup".
      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CERT_P12_BASE64" || -z "$CERT_PASSWORD" ]]; then
            echo "MACOS_CERT_* secrets not set: building ad-hoc signed"
            exit 0
          fi
          keychain="$RUNNER_TEMP/grimalkin-signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" >/dev/null
          # Put the temporary keychain first in the user search list.
          existing="$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "$keychain" $existing
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk '/"Developer ID Application:/ { print $2; exit }')"
          if [[ -z "$identity" ]]; then
            echo "no Developer ID Application identity in the imported p12" >&2
            exit 1
          fi
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "GRIMALKIN_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Prepare notarization key
        env:
          KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$KEY_P8_BASE64" || -z "$KEY_ID" || -z "$ISSUER_ID" ]]; then
            echo "NOTARY_* secrets not set: skipping notarization"
            exit 0
          fi
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$KEY_P8_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          {
            echo "GRIMALKIN_NOTARY_KEY_PATH=$key"
            echo "GRIMALKIN_NOTARY_KEY_ID=$KEY_ID"
            echo "GRIMALKIN_NOTARY_ISSUER=$ISSUER_ID"
          } >> "$GITHUB_ENV"
      - name: Build app bundle and dmg
        run: scripts/make-app-bundle.sh --target ${{ matrix.target }}
      - name: Check the dmg
        run: |
          set -euo pipefail
          dmg=$(ls dist/grimalkin-*-macos-${{ matrix.arch }}.dmg)
          hdiutil attach -readonly -nobrowse -mountpoint /tmp/grimalkin-dmg "$dmg"
          ls -la /tmp/grimalkin-dmg
          test -x /tmp/grimalkin-dmg/grimalkin.app/Contents/MacOS/grimalkin
          test -L /tmp/grimalkin-dmg/Applications
          codesign --verify --deep --strict /tmp/grimalkin-dmg/grimalkin.app
          lipo -archs /tmp/grimalkin-dmg/grimalkin.app/Contents/MacOS/grimalkin
          if [[ -n "${GRIMALKIN_NOTARY_KEY_ID:-}" ]]; then
            xcrun stapler validate /tmp/grimalkin-dmg/grimalkin.app
            spctl --assess --type execute --verbose=2 /tmp/grimalkin-dmg/grimalkin.app
            xcrun stapler validate "$dmg"
          fi
          hdiutil detach /tmp/grimalkin-dmg
      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: grimalkin-macos-${{ matrix.arch }}
          path: dist/grimalkin-*-macos-${{ matrix.arch }}.dmg
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/grimalkin-*-macos-${{ matrix.arch }}.dmg
