[package]
name = "grimalkin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Grimalkin: GPU-accelerated terminal emulator"

[[bin]]
name = "grimalkin"
path = "src/main.rs"

[dependencies]
grimalkin-vt = { path = "../vt" }
grimalkin-graphics = { path = "../graphics" }
grimalkin-pty = { path = "../pty" }
winit = "0.30"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "dx12", "vulkan", "metal"] }
cosmic-text = "0.19"
arboard = { version = "3", default-features = false }
toml = "1"
serde = { version = "1", features = ["derive"] }
pollster = "1"
env_logger = "0.11"
log = "0.4"
dirs = "7"
sys-locale = "0.3"
open = "5"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
notify = "8"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

# Windows clips the skinned window with a window region (skin/win.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

# macOS: the screen's visible frame (work area) for the skin's own maximize.
# The versions are the ones winit 0.30 already links.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", default-features = false, features = ["std", "NSGeometry", "NSArray"] }
objc2-app-kit = { version = "0.2", default-features = false, features = ["std", "NSScreen", "NSWindow", "NSView", "NSResponder"] }
