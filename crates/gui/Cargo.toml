[package]
name = "grimalkin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GPU-accelerated terminal emulator with kitty graphics support"

[[bin]]
name = "grimalkin"
path = "src/main.rs"

[dependencies]
grimalkin-vt = { path = "../vt" }
grimalkin-graphics = { path = "../graphics" }
grimalkin-pty = { path = "../pty" }
winit = "0.30"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "dx12", "vulkan", "metal"] }
cosmic-text = "0.19"
arboard = { version = "3", default-features = false }
toml = "1"
serde = { version = "1", features = ["derive"] }
pollster = "1"
env_logger = "0.11"
log = "0.4"
dirs = "7"
sys-locale = "0.3"
open = "5"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
notify = "8"
toml_edit = "0.25"
unicode-width = "0.2"
unicode-segmentation = "1.12"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

# Preferences window (src/prefs): egui on its own wgpu device. egui-wgpu 0.35 is
# the newest release that builds on Rust 1.92 (0.36+ needs 1.95) and it uses
# wgpu 29, while the terminal renderer uses wgpu 30. The two majors coexist;
# the Preferences window simply gets its own Instance/Device. `wgpu29` only
# exists to switch on the backends egui-wgpu's default features would enable.
egui = { version = "0.35", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.35", default-features = false, features = ["clipboard"] }
egui-wgpu = { version = "0.35", default-features = false, features = ["winit"] }
wgpu29 = { package = "wgpu", version = "29", default-features = false, features = ["std", "wgsl", "dx12", "vulkan", "metal"] }
raw-window-handle = "0.6"

# Windows clips the skinned window with a window region (skin/win.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

# macOS: the screen's visible frame (work area) for the skin's own maximize.
# The versions are the ones winit 0.30 already links.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", default-features = false, features = ["std", "NSGeometry", "NSArray"] }
objc2-app-kit = { version = "0.2", default-features = false, features = ["std", "NSScreen", "NSWindow", "NSView", "NSResponder"] }

# Native menus: the macOS menu bar, and the right-click context menu on macOS
# and Windows. Linux (GTK-only in muda) has no menus yet. The window handle is
# needed to anchor a context menu to the native view/HWND.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
muda = { version = "0.21", default-features = false }

# Windows executable resources (icon, version info); see build.rs. Only used
# when the build target is Windows, but a build script's dependencies cannot be
# gated on the target, so it is compiled everywhere (it is small).
[build-dependencies]
winresource = "0.1"


# Linux packages (see packaging/linux/ and .github/workflows/linux-packages.yml).
# `cargo deb -p grimalkin` and `cargo generate-rpm -p crates/gui` after a
# `cargo build --release`. Asset sources are relative to this crate.
#
# Libraries wgpu, winit and xkbcommon open with dlopen do not show up in the ELF
# NEEDED list, so the ones a window needs are listed by hand: the Vulkan loader,
# xkbcommon, the Wayland client library and fontconfig.
[package.metadata.deb]
name = "grimalkin"
maintainer = "Alice Lankenau <rlankenau@gmail.com>"
copyright = "2025-2026, grimalkin contributors"
license-file = ["../../packaging/linux/copyright", "0"]
extended-description = """\
Grimalkin is a GPU-accelerated terminal emulator with kitty graphics protocol \
support, window skins and color themes. It renders with Vulkan and runs on \
Wayland or X11. Install kitty-terminfo so programs see TERM=xterm-kitty; \
without it Grimalkin falls back to TERM=xterm-256color."""
section = "shells"
priority = "optional"
depends = "$auto, libvulkan1, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libfontconfig1"
recommends = "kitty-terminfo, mesa-vulkan-drivers"
assets = [
    ["target/release/grimalkin", "usr/bin/grimalkin", "755"],
    ["../../packaging/linux/grimalkin.desktop", "usr/share/applications/grimalkin.desktop", "644"],
    ["../../packaging/linux/grimalkin.metainfo.xml", "usr/share/metainfo/grimalkin.metainfo.xml", "644"],
    ["../../assets/icon/grimalkin-16.png", "usr/share/icons/hicolor/16x16/apps/grimalkin.png", "644"],
    ["../../assets/icon/grimalkin-32.png", "usr/share/icons/hicolor/32x32/apps/grimalkin.png", "644"],
    ["../../assets/icon/grimalkin-48.png", "usr/share/icons/hicolor/48x48/apps/grimalkin.png", "644"],
    ["../../assets/icon/grimalkin-64.png", "usr/share/icons/hicolor/64x64/apps/grimalkin.png", "644"],
    ["../../assets/icon/grimalkin-128.png", "usr/share/icons/hicolor/128x128/apps/grimalkin.png", "644"],
    ["../../assets/icon/grimalkin-256.png", "usr/share/icons/hicolor/256x256/apps/grimalkin.png", "644"],
    ["../../assets/icon/grimalkin-512.png", "usr/share/icons/hicolor/512x512/apps/grimalkin.png", "644"],
    ["../../README.md", "usr/share/doc/grimalkin/README.md", "644"],
    ["../../docs/grimalkin.example.toml", "usr/share/doc/grimalkin/grimalkin.example.toml", "644"],
    ["../../packaging/linux/grimalkin.lintian-overrides", "usr/share/lintian/overrides/grimalkin", "644"],
]

[package.metadata.generate-rpm]
name = "grimalkin"
license = "MIT OR Apache-2.0"
summary = "GPU-accelerated terminal emulator with kitty graphics protocol support"
url = "https://github.com/rlankenau/grimalkin"
# ELF dependencies (glibc, fontconfig) are detected from the binary.
auto-req = "auto"
assets = [
    { source = "target/release/grimalkin", dest = "/usr/bin/grimalkin", mode = "755" },
    { source = "../../packaging/linux/grimalkin.desktop", dest = "/usr/share/applications/grimalkin.desktop", mode = "644" },
    { source = "../../packaging/linux/grimalkin.metainfo.xml", dest = "/usr/share/metainfo/grimalkin.metainfo.xml", mode = "644" },
    { source = "../../assets/icon/grimalkin-16.png", dest = "/usr/share/icons/hicolor/16x16/apps/grimalkin.png", mode = "644" },
    { source = "../../assets/icon/grimalkin-32.png", dest = "/usr/share/icons/hicolor/32x32/apps/grimalkin.png", mode = "644" },
    { source = "../../assets/icon/grimalkin-48.png", dest = "/usr/share/icons/hicolor/48x48/apps/grimalkin.png", mode = "644" },
    { source = "../../assets/icon/grimalkin-64.png", dest = "/usr/share/icons/hicolor/64x64/apps/grimalkin.png", mode = "644" },
    { source = "../../assets/icon/grimalkin-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/grimalkin.png", mode = "644" },
    { source = "../../assets/icon/grimalkin-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/grimalkin.png", mode = "644" },
    { source = "../../assets/icon/grimalkin-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/grimalkin.png", mode = "644" },
    { source = "../../README.md", dest = "/usr/share/doc/grimalkin/README.md", mode = "644", doc = true },
    { source = "../../docs/grimalkin.example.toml", dest = "/usr/share/doc/grimalkin/grimalkin.example.toml", mode = "644", doc = true },
    { source = "../../LICENSE-MIT", dest = "/usr/share/licenses/grimalkin/LICENSE-MIT", mode = "644", license = true },
    { source = "../../LICENSE-APACHE", dest = "/usr/share/licenses/grimalkin/LICENSE-APACHE", mode = "644", license = true },
]

# The libraries winit and wgpu open with dlopen are not in the ELF NEEDED list,
# so they are required by soname. Sonames resolve to the right package on every
# RPM distribution (Fedora names the Wayland one libwayland-client, openSUSE
# another way); fontconfig is detected from the binary.
[package.metadata.generate-rpm.requires]
"libvulkan.so.1()(64bit)" = "*"
"libxkbcommon.so.0()(64bit)" = "*"
"libxkbcommon-x11.so.0()(64bit)" = "*"
"libwayland-client.so.0()(64bit)" = "*"

[package.metadata.generate-rpm.recommends]
kitty-terminfo = "*"
mesa-vulkan-drivers = "*"
