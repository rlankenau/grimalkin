# Grimalkin example configuration. Every setting is optional; the values shown
# are the defaults (except where noted). Copy this file to:
#   Unix:    ~/.config/grimalkin/grimalkin.toml   (or $XDG_CONFIG_HOME/grimalkin/)
#   Windows: %APPDATA%\grimalkin\grimalkin.toml
# or pass --config <path>.

# Number of lines kept in the scrollback buffer (main screen only).
scrollback_lines = 10000

# Window skin: an undecorated, possibly non-rectangular window drawn from
# bitmaps (see docs/SKINS.md). A skin name (looked up in the "skins" folder
# next to this file, then the built-ins), a path to a skin folder, or "none"
# for the normal OS window. Built-ins: llama, grimalkin, mint (and debug).
# `grimalkin --skin NAME` overrides it.
skin = "none"
# WinAMP skins: `skin = "winamp:NAME"` loads <config dir>/grimalkin/skins/NAME.wsz
# (install one with `grimalkin --install-skin PATH_OR_URL`); a path to a .wsz also
# works. Their pledit.txt colors become the theme unless you set `theme`.
# With this on, the skin's viscolor.txt also sets the 16 ANSI colors.
winamp_viscolor_palette = false

# Program to run in the terminal. Empty means your default shell ($SHELL on
# Unix; pwsh, powershell or cmd on Windows). `grimalkin -e CMD ARGS...`
# overrides both of these.
shell = ""
shell_args = []

# Color theme: a built-in name (run `grimalkin --list-themes`: default,
# catppuccin-mocha, dracula, gruvbox-dark, solarized-light, nord, tokyo-night)
# or a file of your own. Themes are looked up in
#   <config dir>/grimalkin/themes/NAME.toml   (grimalkin format, see below)
#   <config dir>/grimalkin/themes/NAME.conf   (kitty format: drop in any theme
#                                              from kitty-themes)
# and then among the built-ins. `grimalkin --theme NAME` overrides this.
# The config file is watched: saving it (or a theme file) re-applies the theme,
# colors and font without restarting.
theme = "default"

[font]
# Families in fallback order. The first installed one defines the cell size.
# A single string also works: family = "JetBrains Mono"
# Defaults per OS (used when this is left unset): Windows ["Cascadia Mono",
# "Consolas", "Courier New"], macOS ["Menlo", "SF Mono", "Monaco"], Linux
# ["DejaVu Sans Mono", "Liberation Mono", "Noto Sans Mono"]. Uncomment one:
# family = ["Cascadia Mono", "Consolas"]       # Windows
# family = ["Menlo", "SF Mono"]                # macOS
# family = ["DejaVu Sans Mono"]                # Linux
# Extra families tried after `family` and before the system fallback, in
# order. The default is a CJK list per OS; each script group is served by one
# family so kanji and kana match (Windows ["Yu Gothic UI", "Microsoft YaHei",
# "Malgun Gothic"], macOS ["PingFang SC", "Hiragino Sans"], Linux
# ["Noto Sans CJK SC", "Noto Sans CJK JP", "Noto Sans CJK KR"]).
# fallback = ["Microsoft YaHei", "Malgun Gothic"]
# Size in points.
size = 13.0
# Multiplier for the natural line height (ascent + descent).
line_height = 1.0

[window]
# Initial size in character cells.
cols = 120
rows = 35
# Padding around the text area in logical pixels.
padding = 4.0
# Background opacity: 1.0 is opaque, 0.0 fully transparent.
opacity = 1.0
# Title shown before the shell sets one (and always, if dynamic_title is false).
title = "grimalkin"
# Follow window titles set by programs (OSC 0/2).
dynamic_title = true

# Per-key overrides applied on top of the theme, so they are commented out
# here: any key you set beats the theme's own colour. The values shown are
# those of the "default" theme.
[colors]
# foreground = "#dddddd"
# background = "#000000"
# cursor = "#cccccc"
# cursor_text = "#000000"            # text under a block cursor (default: background)
# selection_background = "#fffacd"   # alias: selection_bg
# selection_foreground = "#000000"   # alias: selection_fg
# url = "#0d73cc"                    # underline color of a hovered link (default: text color)
# The 16 ANSI colors, by name (or color0 .. color15):
# black, red, green, yellow, blue, magenta, cyan, white, bright_black, ...
# red = "#cc0403"
# or as a list: a shorter list overrides only the first entries.
# ansi = ["#000000", "#cc0403", "#19cb00", "#cecb00", "#0d73cc", "#cb1ed1",
#         "#0dcdcd", "#dddddd", "#767676", "#f2201f", "#23fd00", "#fffd00",
#         "#1a8fff", "#fd28ff", "#14ffff", "#ffffff"]

# A theme file (themes/NAME.toml) has the same [colors] table plus a name and
# optional [font] (family, size, line_height) and [cursor] (shape, blink)
# tables. When a theme sets those, they replace the ones in this file:
#
#   name = "Catppuccin Mocha"
#   [colors]
#   foreground = "#cdd6f4"
#   background = "#1e1e2e"
#   ...
#   [font]
#   family = ["JetBrains Mono"]

[cursor]
# "block", "underline" or "bar". Programs can change this at runtime (DECSCUSR).
shape = "block"
# Blink the cursor (programs can also request blinking).
blink = false

[input]
# macOS: use the Option key as Alt (sends ESC prefix) instead of composing
# special characters.
option_as_alt = true
# Plain Ctrl+V pastes through grimalkin (sanitised, bracketed when the program
# asks) instead of sending Ctrl+V to the program. Default: true on Windows
# (stops PSReadLine pasting unsanitised), false elsewhere. Ctrl+Shift+V
# always works.
ctrl_v_paste = true

[bell]
# Flash the window for visual_ms milliseconds when a program rings the bell.
visual = true
visual_ms = 150
# Play the system alert sound as well.
audible = false

[pty]
# Windows only (ignored elsewhere). Create the ConPTY pseudoconsole in
# passthrough mode so a sideloaded modern ConPTY (conpty.dll + OpenConsole.exe
# next to grimalkin.exe) or Windows 11 forwards kitty graphics (APC) and other
# sequences untouched. Stock Windows 10 ConPTY strips APC; see the README
# section "Windows: kitty graphics need a newer ConPTY". The environment
# variable GRIMALKIN_CONPTY_PASSTHROUGH=1 (or 0) overrides this setting.
passthrough = false

# Cursor movement after a kitty graphics placement: "auto", "protocol" or
# "none". "protocol" moves the cursor past the image as the protocol says
# (unless the command has C=1). "none" never moves it (C=1 for every
# placement). "auto" is "none" on Windows and "protocol" elsewhere: ConPTY's
# OpenConsole does not learn that an APC placement moved the cursor, so the next
# output would be drawn too high; tools that print their own newlines (such as
# `gcat --conpty`) then work.
graphics_cursor = "auto"

[clipboard]
# Allow programs to set the clipboard with OSC 52.
osc52_write = true
# Allow programs to read the clipboard with OSC 52. Off by default because any
# program running in the terminal (including over ssh) could read it.
osc52_read = false
